<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AMCD57 - Club d'Aéromodélisme{% endblock %}</title>

    {% load static %}

    <!-- CSS personnalisé (Tailwind viendra ici plus tard) -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- Navigation (à créer plus tard) -->
    <nav style="background: #1e40af; padding: 15px 0; margin-bottom: 20px">
      <div
        class="container"
        style="max-width: 1200px; margin: 0 auto; padding: 0 20px"
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <a
            href="{% url 'core:home' %}"
            style="
              color: white;
              font-size: 1.5rem;
              font-weight: bold;
              text-decoration: none;
            "
          >
            🛩️ AMCD57
          </a>
          <div style="display: flex; gap: 20px">
            <a
              href="{% url 'core:home' %}"
              style="
                color: white;
                text-decoration: none;
                padding: 8px 16px;
                border-radius: 4px;
              "
              >Accueil</a
            >
            <a
              href="{% url 'blog:article_list' %}"
              style="
                color: white;
                text-decoration: none;
                padding: 8px 16px;
                border-radius: 4px;
              "
              >Blog</a
            >
            <a
              href="{% url 'admin:index' %}"
              style="
                color: white;
                text-decoration: none;
                padding: 8px 16px;
                border-radius: 4px;
              "
              >Admin</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Messages Flash Django -->
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Contenu principal de chaque page -->
    <main>{% block content %} {% endblock %}</main>

    <!-- Footer -->
    <footer>
      <div class="container">
        <p>&copy; 2025 AMCD57 - Tous droits réservés</p>
      </div>
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
