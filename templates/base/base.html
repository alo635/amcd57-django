<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AMCD57 - Club d'Aéromodélisme{% endblock %}</title>

    {% load static %}

    <!-- CSS personnalisé (Tailwind viendra ici plus tard) -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- Navigation (à créer plus tard) -->
    <nav>
      <div class="container">
        <!-- Menu de navigation -->
      </div>
    </nav>

    <!-- Messages Flash Django -->
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Contenu principal de chaque page -->
    <main>{% block content %} {% endblock %}</main>

    <!-- Footer -->
    <footer>
      <div class="container">
        <p>&copy; 2025 AMCD57 - Tous droits réservés</p>
      </div>
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
