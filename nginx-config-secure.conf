upstream amcd57_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name amcd.alodev.ovh www.amcd.alodev.ovh;
    return 301 https://$host$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amcd.alodev.ovh www.amcd.alodev.ovh;

    ssl_certificate /etc/letsencrypt/live/amcd.alodev.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amcd.alodev.ovh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ===== HEADERS DE SÉCURITÉ =====

    # HSTS - Force HTTPS pendant 1 an avec preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy - Le plus important pour Mozilla Observatory
    # Cette politique autorise :
    # - Scripts : même origine + CDN Tailwind
    # - Styles : même origine + CDN Tailwind + styles inline (pour Tailwind)
    # - Fonts : même origine + Google Fonts
    # - Images : même origine + data: (pour les images base64)
    # - Objets, media, frames : bloqués par défaut
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com 'unsafe-inline'; style-src 'self' https://cdn.tailwindcss.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # X-Frame-Options - Empêche le clickjacking
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options - Empêche le MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection - Protection XSS pour anciens navigateurs
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy - Contrôle des informations de référent
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy - Contrôle des fonctionnalités du navigateur
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Cross-Origin-Opener-Policy - Isolation entre fenêtres
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cross-Origin-Resource-Policy - Contrôle du partage de ressources
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Cross-Origin-Embedder-Policy - Désactivé pour permettre les images OpenWeatherMap
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ===== LIMITES ET TIMEOUTS =====

    # Limite de taille d'upload (cohérent avec Django : 10 MB)
    client_max_body_size 10M;

    # Timeouts pour éviter les attaques DoS
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # ===== LOCATIONS =====

    # Application Django
    location / {
        proxy_pass http://amcd57_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fichiers statiques (CSS, JS, etc.)
    location /static/ {
        alias /var/www/amcd57/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Réappliquer les headers de sécurité pour les fichiers statiques
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Médias uploadés par les utilisateurs
    location /media/ {
        alias /var/www/amcd57/media/;
        expires 30d;
        add_header Cache-Control "public";

        # Réappliquer les headers de sécurité pour les médias
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Bloquer l'accès aux fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~* \.(env|git|gitignore|ini|log|sh|sql|conf|bak|backup|old)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logs
    access_log /var/www/amcd57/logs/nginx-access.log;
    error_log /var/www/amcd57/logs/nginx-error.log;
}
